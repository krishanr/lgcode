[project]
name = "lgcode"
version = "0.1.0"
description = "A Claude Code-style terminal coding agent built on LangGraph"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    "langchain-anthropic>=1.0",
    "langchain-core>=1.0",
]

[project.scripts]
lgcode = "lgcode.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lgcode"]
